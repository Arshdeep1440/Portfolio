<title>Paisa Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a phone on the left, a designer-notes rail on the right. On narrow screens they stack. */
:root{
  --page:#E4E8E2; --app:#F4F6F1; --surface:#FFFFFF; --sunk:#EBEFE8;
  --ink:#14201C; --ink-2:#4A5852; --ink-3:#7E8A84; --line:#DCE2DA;
  --teal:#0E6B5C; --teal-soft:#D9ECE5; --teal-ink:#FFFFFF;
  --mari:#D98A12; --mari-soft:#FBEBCF; --mari-ink:#5A3700;
  --good:#2B8A55; --warn:#B87A0E; --bad:#C24E37;
  --mute-1:#9FB8AF; --mute-2:#B9CBC4; --mute-3:#CFDBD6;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#0B100E; --app:#111816; --surface:#19221F; --sunk:#141C19;
  --ink:#E8EFEB; --ink-2:#A7B5AF; --ink-3:#73817B; --line:#28332F;
  --teal:#4FC2A8; --teal-soft:#16382F; --teal-ink:#06201A;
  --mari:#F0AE3E; --mari-soft:#3A2B10; --mari-ink:#FBE3B6;
  --good:#5BC48A; --warn:#E3A945; --bad:#E8775F;
  --mute-1:#3E5850; --mute-2:#34493F; --mute-3:#2B3C36; color-scheme:dark }}
:root[data-theme="dark"]{
  --page:#0B100E; --app:#111816; --surface:#19221F; --sunk:#141C19;
  --ink:#E8EFEB; --ink-2:#A7B5AF; --ink-3:#73817B; --line:#28332F;
  --teal:#4FC2A8; --teal-soft:#16382F; --teal-ink:#06201A;
  --mari:#F0AE3E; --mari-soft:#3A2B10; --mari-ink:#FBE3B6;
  --good:#5BC48A; --warn:#E3A945; --bad:#E8775F;
  --mute-1:#3E5850; --mute-2:#34493F; --mute-3:#2B3C36; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding-block:28px;max-width:1120px;margin:0 auto}
.device{flex:0 0 auto;width:390px;height:812px;border-radius:46px;padding:10px;background:#0D1311;box-shadow:0 30px 60px -30px rgba(10,30,25,.45)}
.screen{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:var(--app);display:flex;flex-direction:column}
.status{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.view{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}

/* Notes rail */
.notes{flex:1 1 360px;max-width:420px;min-width:0;padding-top:8px}
.notes .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.notes h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.02em;margin:6px 0 4px;text-wrap:balance}
.notes .sub{color:var(--ink-2);margin:0 0 20px}
.notes h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 8px;text-wrap:balance}
.notes ul{margin:0;padding-left:18px;display:grid;gap:7px;color:var(--ink-2)}
.notes li b{color:var(--ink);font-weight:600}
.notes section{padding:18px 0;border-top:1px solid var(--line)}
.jump,.states{display:flex;flex-wrap:wrap;gap:8px}
.jump button,.states button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.jump button[aria-pressed="true"],.states button[aria-pressed="true"]{background:var(--ink);color:var(--app);border-color:var(--ink)}

@media (max-width:860px){
  .stage{flex-direction:column;align-items:center;gap:24px;padding-block:16px}
  .notes{max-width:390px;width:100%;flex:0 0 auto}
}
@media (max-width:430px){
  .device{width:100%;height:760px;border-radius:30px;padding:6px}
  .screen{border-radius:25px}
}

/* ---------- App components ---------- */
.pad{padding:8px 18px 24px}
.h-greet{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.sync{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.dot.bad{background:var(--bad)}
.card{background:var(--surface);border-radius:var(--r);padding:16px;margin-top:12px;position:relative}
.card h3{margin:0;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ask{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--teal);padding:4px 8px;border-radius:999px;background:var(--teal-soft)}
.ask svg{width:12px;height:12px}
.big{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1}
.mid{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.muted{color:var(--ink-3)} .ink2{color:var(--ink-2)}
.small{font-size:12px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600}
.pill.warn{background:var(--mari-soft);color:var(--mari-ink)}
.pill.good{background:var(--teal-soft);color:var(--teal)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;font-size:12.5px;margin-top:12px}
.banner.bad{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--ink)}
.banner.info{background:var(--mari-soft);color:var(--mari-ink)}
.banner button{font-weight:600;text-decoration:underline;margin-left:auto;white-space:nowrap}

.weather{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;background:linear-gradient(135deg,var(--teal-soft),var(--surface) 70%)}
.weather .w-title{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.1}

.safe{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.flow-bar{display:flex;height:26px;border-radius:8px;overflow:hidden;margin:12px 0 10px;gap:2px}
.flow-bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.insight{background:var(--ink);color:var(--app)}
.insight .mono{color:color-mix(in srgb,var(--app) 60%,transparent)}
.insight p{margin:6px 0 12px;font-size:15px;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px}
.btn.primary{background:var(--teal);color:var(--teal-ink)}
.btn.ghost{border:1px solid var(--line)}
.insight .btn.ghost{border-color:color-mix(in srgb,var(--app) 30%,transparent)}
.btn.light{background:var(--app);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.bill{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.bill:first-of-type{border-top:0}
.date-chip{font-family:var(--mono);font-size:10px;text-align:center;line-height:1.1;padding:5px 0;border-radius:10px;background:var(--sunk)}
.date-chip b{display:block;font-size:15px;font-family:var(--display)}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;margin:10px 0 6px}
.progress span{display:block;height:100%;background:var(--teal);border-radius:99px}

/* Tab bar */
.tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);padding:8px 10px 22px;background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="true"]{color:var(--ink)}
.tabbar .ai-tab span.orb{width:40px;height:40px;margin-top:-20px;border-radius:50%;display:grid;place-items:center;background:var(--teal);color:var(--teal-ink);box-shadow:0 6px 16px -6px var(--teal)}

/* Onboarding */
.onb{display:flex;flex-direction:column;min-height:100%;padding:14px 22px 26px}
.onb .step{font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.onb h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:14px 0 8px;text-wrap:balance}
.onb p.lede{color:var(--ink-2);margin:0 0 20px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:500;font-size:14px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft);color:var(--ink)}
.spacer{flex:1}
.consent{background:var(--surface);border-radius:var(--r);padding:16px;display:grid;gap:12px;margin-bottom:16px}
.consent .row svg{flex:0 0 22px;color:var(--teal)}
.fetch-list{display:grid;gap:14px;margin:8px 0 22px}
.fetch-list .row{font-size:14px}
.tick{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:0 0 22px;background:var(--sunk);color:var(--ink-3)}
.tick.done{background:var(--teal);color:var(--teal-ink)}
.tick.run{border:2px solid var(--teal);border-right-color:transparent;background:none;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.teaser{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13px;color:var(--ink-2);opacity:0;transform:translateY(6px);transition:all .4s}
.teaser.show{opacity:1;transform:none}
.reveal{background:var(--ink);color:var(--app);border-radius:22px;padding:20px;margin-bottom:14px}
.reveal .big{color:var(--mari)}

/* Chat */
.chat-head{flex:0 0 auto;padding:4px 18px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.chat-head .t{font-family:var(--display);font-weight:700;font-size:20px}
.tones{display:flex;background:var(--sunk);border-radius:999px;padding:3px}
.tones button{padding:5px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--ink-3)}
.tones button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chat-wrap{display:flex;flex-direction:column;height:100%}
.msgs{flex:1 1 auto;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:12px;scrollbar-width:none}
.msgs::-webkit-scrollbar{display:none}
.u{align-self:flex-end;max-width:80%;background:var(--teal);color:var(--teal-ink);padding:9px 13px;border-radius:18px 18px 4px 18px;font-weight:500}
.u .ctx{display:block;font-family:var(--mono);font-size:10px;opacity:.75;margin-bottom:2px}
.u .via{font-family:var(--mono);font-size:10px;opacity:.75;display:flex;gap:4px;align-items:center;margin-bottom:2px}
.a{align-self:stretch;display:grid;gap:10px}
.a .txt{font-size:15px;line-height:1.45}
.a .viz{background:var(--surface);border-radius:var(--r);padding:12px}
.src{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.follow{display:flex;flex-wrap:wrap;gap:6px}
.follow button{padding:7px 12px;border-radius:999px;border:1.5px solid var(--teal);color:var(--teal);font-weight:600;font-size:13px}
.spoken{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-2);background:var(--sunk);border-radius:12px;padding:7px 10px}
.spoken svg{flex:0 0 16px;color:var(--teal)}
.guard{font-size:12px;background:var(--mari-soft);color:var(--mari-ink);border-radius:12px;padding:8px 10px}
.typing{display:flex;gap:4px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--ink-3);animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-4px);opacity:.5}}
.composer{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:var(--app)}
.composer input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--ink)}
.icon-btn.mic{background:var(--teal);color:var(--teal-ink)}
.icon-btn svg{width:20px;height:20px}
.intro{display:grid;gap:12px;padding-top:6px}
.intro .mid{line-height:1.2}
.start{display:grid;gap:8px}
.start button{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);font-weight:500;text-align:left}
.start button small{color:var(--ink-3);font-family:var(--mono);font-size:10px}
.listen{position:absolute;inset:auto 0 0 0;background:var(--surface);border-radius:26px 26px 0 0;padding:22px 20px 34px;box-shadow:0 -10px 30px -10px rgba(0,0,0,.2);display:grid;gap:14px;justify-items:center;text-align:center;z-index:5}
.wave{display:flex;gap:4px;align-items:center;height:40px}
.wave i{width:5px;border-radius:3px;background:var(--teal);animation:wv .9s ease-in-out infinite}
@keyframes wv{0%,100%{height:8px}50%{height:36px}}
.listen .heard{font-size:17px;font-weight:500;min-height:24px}

/* Viz pieces */
svg text{font-family:var(--body)}
.slider{width:100%;accent-color:var(--teal)}
.sub-row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line);align-items:center}
.sub-row:first-child{border-top:0}
.sub-row .flag{grid-column:1/-1;font-size:12px;color:var(--mari-ink);background:var(--mari-soft);padding:4px 8px;border-radius:8px;justify-self:start}
.drill-list{display:grid;gap:8px}
.drill-list .bar{height:10px;border-radius:5px;background:var(--mari)}
.link{color:var(--teal);font-weight:600;font-size:12.5px}
.tip{font-size:12.5px;margin-top:8px;color:var(--ink-2);min-height:18px}
.timeline{display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:center}
.timeline .k{width:12px;height:12px;border-radius:50%;background:var(--ink-3)}

/* Goals tab */
.mem{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line)}
.mem:first-child{border-top:0}
.mem .tag{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.mem .x{color:var(--ink-3);font-size:12px;font-weight:600}
.mem.new{animation:flash 1.6s}
@keyframes flash{0%{background:var(--mari-soft)}100%{background:transparent}}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.ladder div{padding:8px;border-radius:10px;background:var(--sunk);font-size:11px;line-height:1.3}
.ladder div.on{background:var(--teal-soft);color:var(--ink)}
.ladder b{display:block;font-family:var(--mono);font-size:10px;color:var(--teal)}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--ink);color:var(--app);padding:11px 14px;border-radius:14px;font-size:13px;z-index:6}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage">
  <div class="device"><div class="screen" id="screen">
    <div class="status"><span>21:48</span><span>Thu 22 Oct</span><span>5G ▮▮▮</span></div>
    <div class="view" id="view"></div>
    <nav class="tabbar" id="tabbar" hidden aria-label="Main">
      <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
      <button data-tab="ask" class="ai-tab"><span class="orb"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg></span>Ask Paisa</button>
      <button data-tab="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>Goals</button>
    </nav>
  </div></div>

  <aside class="notes" aria-label="Designer notes">
    <div class="eyebrow">Product design assignment · prototype</div>
    <h1>Paisa, a money advisor that does the noticing</h1>
    <p class="sub">Persona: Riya, 26, product analyst in Bengaluru. ₹85,000 salary on the 1st. Saving for a Goa trip on 15 Dec. All figures are sample data.</p>
    <section>
      <div class="eyebrow" style="margin-bottom:8px">Jump to</div>
      <div class="jump" id="jump">
        <button data-go="onb1">Onboarding</button>
        <button data-go="home">Home</button>
        <button data-go="ask">Ask Paisa</button>
        <button data-go="hero">Hero story</button>
        <button data-go="goals">Goals & memory</button>
      </div>
    </section>
    <section id="notes-body"></section>
    <section>
      <div class="eyebrow" style="margin-bottom:8px">Edge states (toggle, then look at Home)</div>
      <div class="states" id="states">
        <button data-edge="sync">Sync failed</button>
        <button data-edge="salary">Salary not detected</button>
        <button data-edge="uncat">Unsorted transactions</button>
        <button data-edge="sample">Sample-data mode</button>
      </div>
    </section>
  </aside>
</div>

<script>
// ---------- Data (sample persona, all numbers reconcile) ----------
const inr = n => '₹' + Math.round(n).toLocaleString('en-IN');
const D = {
  salary:85000, bills:31500, goalSave:12000, flex:41500, flexSpent:33800, daysLeft:10, safeToday:770, spentToday:310,
  cats:[
    {k:'food', n:'Food delivery', v:9800, hot:true, m:[['Swiggy',5600],['Zomato',4200]]},
    {k:'shop', n:'Shopping', v:7200, m:[['Myntra',3400],['Amazon',2900],['Nykaa',900]]},
    {k:'cabs', n:'Cabs & travel', v:5100, m:[['Uber',3300],['Rapido',1100],['Namma Metro',700]]},
    {k:'groc', n:'Groceries', v:4300, m:[['Blinkit',2600],['BigBasket',1700]]},
    {k:'out',  n:'Going out', v:3400, m:[['Toit',1900],['PVR',1500]]},
    {k:'oth',  n:'Everything else', v:4000, m:[['Pharmacy',1300],['Gifts',1600],['Misc UPI',1100]]},
  ],
  foodMonths:[['May',6400],['Jun',7100],['Jul',6800],['Aug',7300],['Sep',6900],['Oct',9800]],
  // orders per weekday × slot (Breakfast, Lunch, Evening, After 10pm); sums to 26
  heat:{Mon:[0,1,1,3],Tue:[0,0,1,3],Wed:[0,1,0,2],Thu:[0,0,1,3],Fri:[0,1,2,1],Sat:[1,1,2,0],Sun:[1,0,1,0]},
  subs:[['Netflix',649,''],['Spotify',119,''],['Cult.fit',1499,'No check-ins for 7 weeks'],['Disney+ Hotstar',299,'Already included in your Airtel plan'],['iCloud+',75,'']],
  waterfall:[['Sep',28900,'total'],['Food delivery',2900],['Shopping',2100],['Cabs',1100],['Going out',-1200],['Oct',33800,'total']],
};

// ---------- State ----------
const S = {

function pulseChart(){
  const W=320,H=150,L=8,R=8,T=14,B=22, days=31, maxY=46000;

  for(let d=1;d<=22;d++){ const f=d<=10?0.95:0.95+(d-10)/12*0.197; const v=d*per*f; act.push([x(d),y(v)]); if(firstAbove===null && f>1.1) firstAbove=d; }

function treemapLayout(items,x,y,w,h){
  if(items.length===1) return [{...items[0],x,y,w,h}];
  const tot=items.reduce((s,i)=>s+i.v,0); let acc=0,k=0;
  for(;k<items.length-1;k++){ if(acc+items[k].v>tot/2 && k>0) break; acc+=items[k].v; }
  const a=items.slice(0,k), b=items.slice(k), ra=a.reduce((s,i)=>s+i.v,0)/tot;
  return w>=h ? [...treemapLayout(a,x,y,w*ra,h),...treemapLayout(b,x+w*ra,y,w*(1-ra),h)]
              : [...treemapLayout(a,x,y,w,h*ra),...treemapLayout(b,x,y+h*ra,w,h*(1-ra))];
}

const view=document.getElementById('view'), tabbar=document.getElementById('tabbar'), screen=document.getElementById('screen');

function render(){
  const s=S.screen;
  tabbar.hidden = s.startsWith('onb');
  if(s==='onb1') view.innerHTML=onb1();
  else if(s==='onb2') view.innerHTML=onb2();
  else if(s==='onb3') { view.innerHTML=onb3(); runFetch(); }
  else if(s==='onb4') view.innerHTML=onb4();
  else if(S.tab==='home') view.innerHTML=home();
  else if(S.tab==='ask') view.innerHTML=ask();
  else view.innerHTML=goals();
  tabbar.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current', String(!s.startsWith('onb') && b.dataset.tab===S.tab)));
  if(S.tab==='ask' && !s.startsWith('onb')){ const m=view.querySelector('.msgs'); if(m) m.scrollTop=m.scrollHeight; }
  renderNotes();
}

let fetchTimers=[];
function runFetch(){
  fetchTimers.forEach(clearTimeout); fetchTimers=[];
  const steps=[...view.querySelectorAll('[data-fs]')];
  steps.forEach((el,i)=>{
    fetchTimers.push(setTimeout(()=>{ const t=el.querySelector('.tick'); t.className='tick run'; t.innerHTML=''; },i*900));
    fetchTimers.push(setTimeout(()=>{ const t=el.querySelector('.tick'); t.className='tick done'; t.innerHTML=I.check; if(i===2) view.querySelector('[data-tz="0"]')?.classList.add('show'); if(i===3) view.querySelector('[data-tz="1"]')?.classList.add('show'); },i*900+800));
  });
  fetchTimers.push(setTimeout(()=>{ if(S.screen==='onb3'){ S.screen='onb4'; render(); } },steps.length*900+1400));
}

function ask(){
  const intro = !S.chat.length ? `<div class="intro"><div class="mid">I've read 6 months of your money. Where do you want to start?</div>
    <div class="start">${START.map(([k,q,t])=>`<button data-ask="${k}"><span>${q}</span><small>${t}</small></button>`).join('')}</div>
    <div class="small muted">Tap a question, type your own, or hold the mic and talk.</div></div>` : '';
  return `<div class="chat-wrap"><div class="chat-head"><span class="t">Ask Paisa</span>
    <div class="tones" role="group" aria-label="Tone">${['neutral','hype','roast','meme'].map(t=>`<button data-tone="${t}" aria-pressed="${S.tone===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></div>
    <div class="msgs">${intro}${S.chat.map(renderMsg).join('')}${S.busy?'<div class="typing"><i></i><i></i><i></i></div>':''}</div>
    <form class="composer" id="composer"><input id="q" placeholder="Ask about your money…" autocomplete="off" aria-label="Ask a question">
      <button type="button" class="icon-btn mic" data-act="voice" aria-label="Ask by voice">${I.mic}</button></form>
    ${S.listening?`<div class="listen"><div class="mono muted">LISTENING</div><div class="wave">${Array.from({length:14},(_,i)=>`<i style="animation-delay:${(i%7)*.09}s"></i>`).join('')}</div><div class="heard" id="heard"></div><button class="small muted" data-act="cancelVoice">Cancel</button></div>`:''}
  </div>`;
}
function renderMsg(m){
  if(m.role==='u') return `<div class="u">${m.from?`<span class="ctx">ABOUT: ${m.from.toUpperCase()}</span>`:''}${m.voice?`<span class="via">${I.mic.replace('<svg','<svg width="11" height="11"')} said</span>`:''}${m.text}</div>`;
  const sc=SCN[m.key], tone=sc.forceNeutral?'neutral':m.tone, text=sc.say[tone]||sc.say.neutral;
  return `<div class="a">
    ${sc.forceNeutral&&m.tone!=='neutral'?`<div class="guard">Switched to a straight answer. Money worries deserve one. Your ${m.tone} mode comes back on the next topic.</div>`:''}
    ${m.voice?`<div class="spoken">${I.speak}<span>Read aloud: the short answer. The chart stays on screen.</span></div>`:''}
    <div class="txt">${text}</div>
    ${sc.viz?`<div class="viz">${sc.viz(m)}</div>`:''}
    ${sc.src?`<div class="src">${I.check}${sc.src}</div>`:''}
    ${m.last&&sc.next.length?`<div class="follow">${sc.next.map(([k,l])=>`<button data-ask="${k}">${l}</button>`).join('')}</div>`:''}
  </div>`;
}
let mid=0;
function askAI(key,{from,voice,text}={}){
  if(S.busy) return;
  if(key==='memory'){ S.tab='goals'; render(); return; }
  const sc=SCN[key]; if(!sc) return;
  S.screen='app'; S.tab='ask';
  S.chat.forEach(m=>m.last=false);
  S.chat.push({role:'u',text:text||sc.q,from,voice});
  S.busy=true; render();
  setTimeout(()=>{ S.busy=false; S.chat.push({role:'a',key,tone:S.tone,voice,id:++mid,last:true});
    if(sc.effect==='nudge' && !S.memory.some(m=>m.nudge)) S.memory.unshift({t:'Late-night weeknight orders are a habit to work on. Remind at 10pm, Mon–Thu.',s:'You told me in chat · just now',nudge:true,fresh:true});
    render(); },750);
}
function freeText(q){
  const s=q.toLowerCase();
  const key = /card|bill|debt|loan|emi|worried|stress/.test(s)?'card' : /goa|trip|afford|goal/.test(s)?'goa' : /subscri|netflix|forgot/.test(s)?'subs'
    : /habit|pattern/.test(s)?'habits' : /when|night|late/.test(s)?'when' : /food|swiggy|zomato/.test(s)?'foodWhy'
    : /more|higher|last month|september/.test(s)?'higher' : /safe/.test(s)?'safe' : 'where';
  askAI(key,{text:q});
}

function renderNotes(){

  const [h,b]=NOTES[k]; document.getElementById('notes-body').innerHTML=`<h2>${h}</h2><ul>${b}</ul>`;
  const cur = S.screen.startsWith('onb')?'onb1':(k==='hero'?'hero':S.tab);
  document.querySelectorAll('#jump button').forEach(x=>x.setAttribute('aria-pressed', String(x.dataset.go===cur)));
  document.querySelectorAll('#states button').forEach(x=>x.setAttribute('aria-pressed', String(S.edge[x.dataset.edge])));

document.addEventListener('click',e=>{

    if(d.go==='onb1'){ S.chat=[]; }
    if(d.go.startsWith('onb')) S.screen=d.go; else { S.screen='app'; S.tab=d.go==='home'?'home':d.go; if(d.go==='onb2') S.screen='onb2'; }
    if(d.go==='home'&&!S.salaryConfirmed) S.edge.salary=true;
    render(); return;
  }
  if(d.tab){ S.tab=d.tab; render(); view.scrollTop=0; return; }
  if(d.intent){ S.intents.has(d.intent)?S.intents.delete(d.intent):S.intents.add(d.intent); render(); return; }
  if(d.bank){ S.banks.has(d.bank)?S.banks.delete(d.bank):S.banks.add(d.bank); render(); return; }
  if(d.salary){ S.salaryConfirmed=d.salary==='yes'; S.edge.salary=!S.salaryConfirmed; render(); return; }
  if(d.ask){ askAI(d.ask,{from:d.from}); return; }
  if(d.tone){ S.tone=d.tone; render(); return; }
  if(d.edge){ S.edge[d.edge]=!S.edge[d.edge]; if(S.screen.startsWith('onb')) S.screen='app'; S.tab='home'; render(); return; }
  if(d.forget!==undefined){ S.memory.splice(+d.forget,1); render(); toast('Forgotten. Paisa will stop using this.'); return; }
  if(d.drill!==undefined){ const m=S.chat.find(m=>m.id==d.mid); m.drill=d.drill||null; render(); return; }
  if(d.cell){ const [day,j,v]=d.cell.split('|'); const m=S.chat.find(m=>m.id==d.mid); const slot=['breakfast','lunch','evening','after 10pm'][j];
    m.sel=day+j; m.selText=`${day}, ${slot}: ${v} order${v==1?'':'s'} in October${+v?`, about ${inr(v*390)}`:''}.`; render(); return; }
  const a=d.act;
  if(a==='dismiss'){ S.insightDismissed=true; render(); }
  if(a==='retry'){ S.edge.sync=false; render(); toast('Synced. All accounts are up to date.'); }
  if(a==='sample'){ S.edge.sample=true; S.screen='app'; S.tab='home'; render(); }
  if(a==='voice'){ S.listening=true; render(); const heard='where is my money going this month';
    let i=0; const tick=setInterval(()=>{ const h=document.getElementById('heard'); if(!h||!S.listening){clearInterval(tick);return;} h.textContent='"'+heard.slice(0,i+=3)+(i<heard.length?'':'"');
      if(i>=heard.length){ clearInterval(tick); setTimeout(()=>{ if(!S.listening) return; S.listening=false; askAI('where',{voice:true,text:'Where is my money going this month?'}); },600);} },70); }
  if(a==='cancelVoice'){ S.listening=false; render(); }
});
document.addEventListener('input',e=>{
  const id=e.target.dataset.cut; if(!id) return;
  const m=S.chat.find(m=>m.id==id); m.cut=e.target.value/100;
  const box=e.target.closest('.viz'); box.innerHTML=vizGoa(m); const s=box.querySelector('input'); s.focus();
});
document.addEventListener('submit',e=>{ e.preventDefault(); const q=document.getElementById('q').value.trim(); if(q) freeText(q); });

render();
</script>
